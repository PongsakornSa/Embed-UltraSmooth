; Sensor node (outdoor): PMS5003 + DHT22 + rain sensor -> ESP-NOW -> gateway
[platformio]
default_envs = node_out01
; per-computer COM ports (git-ignored), see platformio_local.ini.example
extra_configs = platformio_local*.ini

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800 default gave "serial noise" errors on our cables
upload_speed = 230400
build_flags =
  -I../common/include
  -I../gateway/include

lib_deps =
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.15

; Real outdoor node
[env:node_out01]
build_flags =
  ${env.build_flags}
  -DNODE_ID=\"out-01\"
  -DSIM_EXTRA_NODES=0

; Wi-Fi OTA for the physical out-01 node (same LAN as the gateway).
[env:node_out01_ota]
extends = env:node_out01
upload_protocol = espota
upload_port = exam-barrier-out-01.local
upload_flags = --auth=${sysenv.GW_OTA_PASSWORD}

; Real node that ALSO emits 2 simulated nodes (sim-02, sim-03).
; Used for the "1 physical + 2 simulated nodes" scalability level.
[env:node_out01_sim]
build_flags =
  ${env.build_flags}
  -DNODE_ID=\"out-01\"
  -DSIM_EXTRA_NODES=2

; Real board: MOCK PM2.5/temp/RH/rain that keep changing, REAL MQ-2 smoke on GPIO34.
; For demos / dashboard testing only - flash node_out01 for real readings.
[env:node_out01_mock]
build_flags =
  ${env.build_flags}
  -DNODE_ID=\"out-01\"
  -DSIM_EXTRA_NODES=0
  -DMOCK_SENSORS=1

; Second physical node (if you build one) - scalability level 3
[env:node_out02]
build_flags =
  ${env.build_flags}
  -DNODE_ID=\"out-02\"
  -DSIM_EXTRA_NODES=0
