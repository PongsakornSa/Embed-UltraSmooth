; Gateway (indoor): SCD40 + SHT31 + BH1750 + presence, fan (AC) + window servo,
; ESP-NOW from nodes, MQTT/TLS to NETPIE, Telegram alerts, on-device AI.
[platformio]
; per-computer COM ports (git-ignored), see platformio_local.ini.example
extra_configs = platformio_local*.ini

[env:gateway]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800 default gave "serial noise" errors on our cables
upload_speed = 230400
board_build.filesystem = littlefs
; default partition table has 2 OTA app slots (E6) + data partition for LittleFS
board_build.partitions = default.csv
build_flags =
  -I../common/include
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11

; Upload over Wi-Fi after the first USB flash (OTA, E6):
;   pio run -e gateway_ota -t upload
[env:gateway_ota]
extends = env:gateway
upload_protocol = espota
upload_port = smart-classroom-gw.local
upload_flags = --auth=${sysenv.GW_OTA_PASSWORD}
